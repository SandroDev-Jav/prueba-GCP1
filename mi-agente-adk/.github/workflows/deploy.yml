name: CI/CD Deploy to Cloud Run

on:
  push:
    tags:
      - 'v*.*.*'  # Se activa con patrones semánticos como v1.0.0, v2.1.3, etc.
      # O usa 'v*' para activar con cualquier tag que empiece con la letra v

env:
  PROJECT_ID: project-aaad4f6d-a5ff-4939-9b3
  GAR_LOCATION: us-central1
  REPOSITORY: mi-repositorio-docker
  SERVICE: prueba_gcp1
  REGION: us-central1

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

      - name: Build and Push Docker Image
        run: |
          # Se usa github.ref_name para que la imagen Docker lleve el mismo nombre de la versión (ej: v1.0.0)
          IMAGE_TAG="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}:${{ github.ref_name }}"
          docker build -t $IMAGE_TAG .
          docker push $IMAGE_TAG

      - name: Deploy to Cloud Run
        run: |
          IMAGE_TAG="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}:${{ github.ref_name }}"
          gcloud run deploy ${{ env.SERVICE }} \
            --image=$IMAGE_TAG \
            --platform=managed \
            --region=${{ env.REGION }} \
            --allow-unauthenticated \
            --set-env-vars GCS_BUCKET_NAME="informacion-prueba",PDF_FILE_PATH="informacion-prueba/procesos/3 PROCESO DE ASIGNACIÓN DE EQUIPO DE CÓMPUTO.pdf"